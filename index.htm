<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Finanzas & Divisas | ingdavid72</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>📊 Gestor de Finanzas Personal & Divisas</h1>
        <p>Fundamentos de Programación Web (Sección 2662V)</p>
    </header>

    <main class="container">
        <!-- Cotización de Divisas en Tiempo Real -->
        <section class="card" id="divisas-section">
            <h2>🌍 Cotización en Tiempo Real</h2>
            <div id="divisas-container">
                <p>Cargando divisas...</p>
            </div>
        </section>

        <!-- Balance y Registro de Transacciones -->
        <section class="card" id="finanzas-section">
            <h2>💰 Balance General</h2>
            
            <div class="saldo-container">
                <span>Disponible</span>
                <h3 id="saldo-total">$0.00</h3>
            </div>

            <form id="form-transaccion">
                <input type="text" id="concepto" placeholder="Concepto (ej. Nómina, Supermercado)" required>
                <input type="number" id="monto" placeholder="Monto ($)" step="0.01" required>
                <select id="tipo">
                    <option value="ingreso">Ingreso (+)</option>
                    <option value="gasto">Gasto (-)</option>
                </select>
                <button type="submit">Agregar Transacción</button>
            </form>

            <ul id="lista-transacciones"></ul>

            <button id="btn-borrar-todo" class="btn-danger" style="margin-top: 15px;">
                🚨 Borrar todo el historial
            </button>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
